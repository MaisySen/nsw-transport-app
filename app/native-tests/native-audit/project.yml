# Native audit (30 Oct 2026, before build 210): snapshot and fit check of every native surface the app ships,
# rendered on the simulator from the shipped SwiftUI views. No signing, no app build, no upload.
#   NativeAuditTests (iOS): Next trip and Stop board widgets in every family, StandBy, both Live Activities
#     (Lock Screen card, Dynamic Island compact, minimal and expanded).
#   WatchAuditTests (watchOS, hosted by AuditWatchHost): the watch app's rows and screens, every complication family.
# CI only: .github/workflows/ios-native-audit.yml. Contact sheets: tools/native-audit-sheets.py.
name: NativeAudit
options:
  bundleIdPrefix: com.maisysen
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  NativeAuditTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../targets/widget
        includes: ["*.swift", "_shared/*.swift"]
      - Tests/Shared
      - Tests/iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.maisysen.nswtransport.nativeaudit
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SNAPSHOT_TESTS"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
  AuditWatchHost:
    type: application
    platform: watchOS
    sources:
      - WatchHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.maisysen.nswtransport.auditwatchhost
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_CFBundleDisplayName: AuditHost
        TARGETED_DEVICE_FAMILY: "4"
  WatchAuditTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: ../../targets/watch
        includes: ["*.swift"]
      - path: ../../targets/watch-widget/Complications.swift
      - Tests/Shared
      - Tests/Watch
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.maisysen.nswtransport.watchaudit
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SNAPSHOT_TESTS"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AuditWatchHost.app/AuditWatchHost"
        BUNDLE_LOADER: ""
    dependencies:
      - target: AuditWatchHost
        embed: false
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: WatchConnectivity.framework
schemes:
  NativeAuditTests:
    build:
      targets:
        NativeAuditTests: all
    test:
      targets:
        - NativeAuditTests
  WatchAuditTests:
    build:
      targets:
        AuditWatchHost: all
        WatchAuditTests: all
    test:
      targets:
        - WatchAuditTests
