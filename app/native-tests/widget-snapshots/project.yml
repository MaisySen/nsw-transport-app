# Widget snapshot and fit check for the Expo app's widget target (app/targets/widget), build 210.
# Renders the trip widget in every family it supports, on the smallest to the largest iPhone widget sizes,
# at the default and a larger text size, and checks that each layout fits inside the widget's margins.
# CI only (.github/workflows/ios-209-local.yml, mode "snapshots"): brew-free, xcodegen from its release zip.
name: WidgetSnapshots
options:
  bundleIdPrefix: com.maisysen
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  WidgetSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../targets/widget
        includes: ["*.swift", "_shared/*.swift"]
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.maisysen.nswtransport.widgetsnapshots
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SNAPSHOT_TESTS"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
schemes:
  WidgetSnapshotTests:
    build:
      targets:
        WidgetSnapshotTests: all
    test:
      targets:
        - WidgetSnapshotTests
