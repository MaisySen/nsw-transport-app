# Back from outside the app (1 Nov 2026, Bidur on build 214: "Widget missing back button or app screen?").
# A UI test that drives the real app (built for the simulator with its JavaScript by the native audit's entry job):
# every link a widget, the Lock Screen, StandBy, Live Activity, Dynamic Island, Control Center, Siri or a site link
# opens, with the app closed and open. For each it keeps a picture of the landed screen, taps its Back and checks that
# the app's tab bar is there. EntryHost exists only because a UI test needs a host; the tests drive
# com.maisysen.nswtransport. No signing (simulator, run locally), no server, no upload. CI only.
name: EntryUI
options:
  bundleIdPrefix: com.maisysen
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
targets:
  EntryHost:
    type: application
    platform: iOS
    sources:
      - Host
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.maisysen.nswtransport.entryhost
        TARGETED_DEVICE_FAMILY: "1"
  EntryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.maisysen.nswtransport.entryuitests
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: EntryHost
    dependencies:
      - target: EntryHost
schemes:
  EntryUITests:
    build:
      targets:
        EntryHost: all
        EntryUITests: [test]
    test:
      targets:
        - EntryUITests
