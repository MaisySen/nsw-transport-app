name: android-aab-release
# Assembles a release file from numbered parts on a static host, checks its sha256,
# and attaches it to a GitHub prerelease. Manual dispatch only.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL that serves parts p000, p001, ..."
        required: true
      parts:
        description: "Number of parts"
        required: true
      sha256:
        description: "Expected sha256 of the assembled file"
        required: true
      tag:
        description: "Release tag"
        required: true
        default: "android-vc5-aab"
      file_name:
        description: "Asset file name"
        required: true
        default: "transport-1.0.0-vc5.aab"
      title:
        description: "Release title"
        required: true
        default: "Android release bundle 1.0.0 (versionCode 5)"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and assemble
        env:
          BASE: ${{ inputs.base_url }}
          N: ${{ inputs.parts }}
          OUT: ${{ inputs.file_name }}
        run: |
          set -euo pipefail
          : > "$OUT"
          for i in $(seq 0 $((N-1))); do
            p=$(printf "p%03d" "$i")
            curl -fsSL --retry 5 --retry-delay 3 -o "$p" "$BASE/$p"
            cat "$p" >> "$OUT"
            rm "$p"
          done
          ls -l "$OUT"
      - name: Check sha256
        env:
          OUT: ${{ inputs.file_name }}
          WANT: ${{ inputs.sha256 }}
        run: |
          got=$(sha256sum "$OUT" | cut -d" " -f1)
          echo "got $got"
          test "$got" = "$WANT"
      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          OUT: ${{ inputs.file_name }}
          TITLE: ${{ inputs.title }}
          SHA: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$OUT" -R "$GITHUB_REPOSITORY" --prerelease --target main \
              --title "$TITLE" \
              --notes "Signed Android App Bundle for Google Play upload (upload key signature; keystore not included). sha256 $SHA"
          fi
