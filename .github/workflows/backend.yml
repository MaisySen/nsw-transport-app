name: backend

# Server and website checks: the full test suite (with the owner stations share of app and backend tests), both builds, the D1 migration, and no em or en dashes.
on:
  push:
    paths:
      - "backend/**"
      - "app/test/**"
      - "site/**"
      - "docs/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "app/test/**"
      - "site/**"
      - "docs/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Tests
        env:
          # The owner stations guard reads its list from this secret, not from the repository (5 Nov 2026). Without it
          # (a fork's pull request, or before the secret is added) that guard is skipped and says so.
          OWNER_STATIONS: ${{ secrets.OWNER_STATIONS }}
          # The suite is documented and run with Sydney time (5 Nov 2026: with the runner's UTC, 45 timetable tests failed
          # between about 13:00 and 19:00 UTC, on main too). The tests now find Sydney midnight on any machine as well.
          TZ: Australia/Sydney
        run: node --test test/*.test.mjs
      - name: Build with placeholder keys
        env:
          TFNSW_API_KEY: ci
          VAPID_PUBLIC_KEY: ci
          VAPID_PRIVATE_KEY: ci
          VAPID_SUBJECT: mailto:ci@example.com
          TICK_KEY: ci
          ADMIN_KEY: ci
        run: node build.mjs "$RUNNER_TEMP/site" && test ! -e "$RUNNER_TEMP/site/_headers"
      - name: Cloudflare build and migration
        run: |
          node tools/schema.mjs --check
          node build.mjs --cloudflare "$RUNNER_TEMP/dist"
          test -f "$RUNNER_TEMP/dist/worker.mjs" && test -f "$RUNNER_TEMP/dist/public/live/live.js"
          test ! -e "$RUNNER_TEMP/dist/public/app.js"
      - name: No em or en dashes
        shell: bash
        run: |
          if grep -rnI -e $'\xe2\x80\x93' -e $'\xe2\x80\x94' . ../docs ../site; then
            echo "Replace the em or en dashes above."; exit 1
          fi
