name: iOS native build

on:
  workflow_dispatch:
    inputs:
      xtool:
        description: "Also try the xtool build (it has hung on the runner, so it is off by default)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native.yml"

permissions:
  contents: write

concurrency:
  group: ios-native
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios-native
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X"
          xcodebuild -version
          mkdir -p ../out
          xcodebuild -version > ../out/xcode-version.txt

      - name: App icon and project
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 Tools/make_icon.py
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xg
          XG=$(find /tmp/xg -type f -name xcodegen -perm -u+x | head -1)
          "$XG" generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project Transport.xcodeproj -scheme Transport -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -derivedDataPath dd-sim \
            CODE_SIGNING_ALLOWED=NO build > ../xcode-sim.log 2>&1 || { grep -E "error:" ../xcode-sim.log | sort -u | head -80; exit 1; }
          find dd-sim -path "*Debug-iphonesimulator/Transport.app" -maxdepth 6 | head -1 > ../sim-app-path.txt
          test -s ../sim-app-path.txt

      - name: Build for device (unsigned ipa)
        timeout-minutes: 25
        run: |
          set -o pipefail
          # Names the source files a slow optimizer pass is still working on, for the report.
          (
            for m in 4 8 12 16 20; do
              sleep 240
              echo "== still compiling after $m min"
              ps -axo etime=,command= | grep "[s]wift-frontend" | while read -r ET CMD; do
                echo "frontend running $ET: $(echo "$CMD" | grep -oE "(-primary-file|-c) [^ ]+\.swift" | sed -E "s#.*/ios-native/##" | tr "\n" " ")"
                echo "$CMD" | grep -q " -primary-file " || echo "  whole module: $(echo "$CMD" | grep -oE "[^ ]+/Sources/[^ ]+\.swift" | sed -E "s#.*/ios-native/##" | tr "\n" " " | head -c 600)"
              done
            done
          ) > ../device-watch.log 2>&1 &
          xcodebuild -project Transport.xcodeproj -scheme Transport -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath dd-device \
            SWIFT_COMPILATION_MODE=singlefile \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > ../xcode-device.log 2>&1 || { grep -E "error:" ../xcode-device.log | sort -u | head -80; cat ../device-watch.log; exit 1; }
          cat ../device-watch.log || true
          APP=$(find dd-device -path "*Release-iphoneos/Transport.app" -maxdepth 6 | head -1)
          test -n "$APP"
          mkdir -p ../out/Payload
          cp -R "$APP" ../out/Payload/
          (cd ../out && zip -qry Transport-unsigned.ipa Payload && rm -rf Payload)
          plutil -p "$APP/Info.plist" > ../out/info-plist.txt
          ls "$APP/PlugIns" >> ../out/info-plist.txt 2>&1 || true

      - name: Simulator (iPhone 16 Pro)
        run: |
          RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x.get('platform')=='iOS' and x.get('isAvailable')]; r.sort(key=lambda x:[int(p) for p in x['version'].split('.')]); print(r[-1]['identifier'])")
          echo "runtime $RT"
          DEV=$(xcrun simctl create "Shots 16 Pro" com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro "$RT")
          echo "$DEV" > ../sim-id.txt
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b > /dev/null
          xcrun simctl status_bar "$DEV" override --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl privacy "$DEV" grant location com.maisysen.nswtransport || true
          xcrun simctl location "$DEV" set -33.8773,151.1043 || true

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Transport.xcodeproj -scheme Transport -configuration Debug \
            -destination "id=$(cat ../sim-id.txt)" -derivedDataPath dd-test \
            CODE_SIGNING_ALLOWED=NO > ../xcode-test-build.log 2>&1 || { grep -E "error:" ../xcode-test-build.log | sort -u | head -80; exit 1; }

      - name: Tap through every flow, light
        continue-on-error: true
        timeout-minutes: 20
        run: |
          DEV=$(cat ../sim-id.txt)
          xcrun simctl ui "$DEV" appearance light
          mkdir -p ../out/shots ../out/widgets
          TEST_RUNNER_SHOTS_DIR="$GITHUB_WORKSPACE/out/shots" TEST_RUNNER_SHOT_PREFIX=light TEST_RUNNER_SNAPSHOT_DIR="$GITHUB_WORKSPACE/out/widgets" \
          xcodebuild test-without-building -project Transport.xcodeproj -scheme Transport -configuration Debug \
            -destination "id=$DEV" -derivedDataPath dd-test -resultBundlePath ../out/light.xcresult \
            CODE_SIGNING_ALLOWED=NO > ../test-light.log 2>&1

      - name: Tap through every flow, dark
        continue-on-error: true
        timeout-minutes: 15
        run: |
          DEV=$(cat ../sim-id.txt)
          xcrun simctl ui "$DEV" appearance dark
          TEST_RUNNER_SHOTS_DIR="$GITHUB_WORKSPACE/out/shots" TEST_RUNNER_SHOT_PREFIX=dark \
          xcodebuild test-without-building -project Transport.xcodeproj -scheme Transport -configuration Debug \
            -destination "id=$DEV" -derivedDataPath dd-test -resultBundlePath ../out/dark.xcresult \
            -only-testing:TransportUITests CODE_SIGNING_ALLOWED=NO > ../test-dark.log 2>&1

      - name: App Store screenshots (6.9 and 6.5 inch, live data)
        continue-on-error: true
        timeout-minutes: 25
        run: |
          RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x.get('platform')=='iOS' and x.get('isAvailable')]; r.sort(key=lambda x:[int(p) for p in x['version'].split('.')]); print(r[-1]['identifier'])")
          xcrun simctl shutdown "$(cat ../sim-id.txt)" || true
          shoot() {
            NAME="$1"; TYPE="$2"; MODE="$3"; DIR="$GITHUB_WORKSPACE/out/store/$NAME"
            DEV=$(xcrun simctl create "Store $NAME" "$TYPE" "$RT") || return 1
            xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b > /dev/null
            xcrun simctl status_bar "$DEV" override --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 --dataNetwork 5g || true
            xcrun simctl privacy "$DEV" grant location com.maisysen.nswtransport || true
            xcrun simctl location "$DEV" set -33.8773,151.1043 || true
            xcrun simctl ui "$DEV" appearance "$MODE"
            mkdir -p "$DIR"
            TEST_RUNNER_STORE_SHOTS=1 TEST_RUNNER_SHOTS_DIR="$DIR" TEST_RUNNER_SHOT_PREFIX="$MODE" \
            xcodebuild test-without-building -project Transport.xcodeproj -scheme Transport -configuration Debug \
              -destination "id=$DEV" -derivedDataPath dd-test -only-testing:TransportUITests/StoreShots \
              CODE_SIGNING_ALLOWED=NO > "../store-$NAME-$MODE.log" 2>&1 || true
            xcrun simctl shutdown "$DEV" || true
            ls "$DIR"
          }
          shoot iphone-6.9 com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max light
          shoot iphone-6.9 com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max dark
          shoot iphone-6.5 com.apple.CoreSimulator.SimDeviceType.iPhone-11-Pro-Max light \
            || shoot iphone-6.5 com.apple.CoreSimulator.SimDeviceType.iPhone-14-Plus light
          python3 -c "
          import glob,struct
          for p in sorted(glob.glob('../out/store/*/*.png')):
              w,h=struct.unpack('>II',open(p,'rb').read()[16:24]); print(p,w,h)
          " || true

      - name: Collect screenshots
        if: always()
        continue-on-error: true
        run: |
          cd ..
          for R in light dark; do
            if [ -d out/$R.xcresult ]; then
              mkdir -p out/attachments-$R
              xcrun xcresulttool export attachments --path out/$R.xcresult --output-path out/attachments-$R > /dev/null 2>&1 || true
            fi
          done
          ls out/shots | wc -l
          ls out/widgets | wc -l
          rm -rf out/light.xcresult out/dark.xcresult
          if [ -n "$(ls out/shots 2>/dev/null)" ] && [ -n "$(ls out/widgets 2>/dev/null)" ]; then rm -rf out/attachments-*; fi

      - name: Build with xtool (second toolchain check)
        if: ${{ inputs.xtool == true }}
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set -o pipefail
          {
            curl -fsSL -o /tmp/xtool.zip https://github.com/xtool-org/xtool/releases/latest/download/xtool.app.zip
            ditto -x -k /tmp/xtool.zip /tmp/xt
            XT=$(find /tmp/xt -path "*Contents/MacOS/xtool" -type f | head -1)
            echo "xtool at $XT"
            "$XT" --version || true
            "$XT" dev build --ipa --configuration release < /dev/null
          } > ../xtool-build.log 2>&1
          find . -name "*.ipa" -not -path "./.build/*" -not -path "./dd-*" -exec cp {} ../out/Transport-xtool-unsigned.ipa \;
          ls -la ../out

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          R=report.txt
          echo "run ${{ github.run_number }} sha ${{ github.sha }}" > $R
          cat out/xcode-version.txt >> $R 2>/dev/null || true
          for L in test-light.log test-dark.log; do
            if [ -f $L ]; then
              echo "== $L: $(grep -cE "Test Case .* passed" $L) passed, $(grep -cE "Test Case .* failed" $L) failed; $(grep -E '\*\* TEST' $L | tail -1)" >> $R
              grep -E "Test Case .* (passed|failed)|error: -\[|XCTAssert|failed -" $L | sed -E "s#.*/ios-native/##" | sort -u | head -60 >> $R
            fi
          done
          if [ -s device-watch.log ]; then echo "== device build watch" >> $R; head -c 1500 device-watch.log >> $R; fi
          echo "== warnings" >> $R
          cat xcode-sim.log xcode-device.log xcode-test-build.log 2>/dev/null | grep -E "warning:" | grep -v appintentsmetadataprocessor | sed -E "s#.*/ios-native/##" | sort -u | head -40 >> $R
          for L in xcode-sim.log xcode-device.log xtool-build.log; do
            if [ -f $L ]; then
              echo "== $L: $(grep -c 'error:' $L) error lines; $(grep -E '\*\* BUILD' $L | tail -1)" >> $R
              grep -E "error:" $L | sed -E "s#.*/ios-native/##" | sort -u | head -40 >> $R
            fi
          done
          tail -5 xtool-build.log >> $R 2>/dev/null || true
          ls out out/shots out/widgets >> $R 2>/dev/null || true
          zip -qry bundle.zip out store-*.log xcode-sim.log xcode-device.log xcode-test-build.log test-light.log test-dark.log xtool-build.log 2>/dev/null || true
          URL=""
          for i in 1 2 3; do
            URL=$(curl -s -m 120 -F reqtype=fileupload -F time=72h -F fileToUpload=@bundle.zip https://litterbox.catbox.moe/resources/internals/api.php || true)
            case "$URL" in https://*) break;; *) URL="";; esac
            sleep 5
          done
          if [ -z "$URL" ]; then URL=$(curl -s -m 120 -F file=@bundle.zip https://tmpfiles.org/api/v1/upload || true); fi
          echo "bundle: $URL" >> $R
          head -c 7000 $R > r2.txt
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch -q origin ci-out || true
          git checkout -q -B ci-out
          git rm -rq --cached . > /dev/null
          git add -f r2.txt
          git commit -qm "Build report ${{ github.run_number }}"
          git push -qf origin ci-out

      - name: Release the unsigned ipa
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD=$(grep -E "CURRENT_PROJECT_VERSION" project.yml | head -1 | grep -oE "[0-9]+")
          TAG="ios-native-build-$BUILD"
          cd ../out
          gh release delete "$TAG" --repo "${{ github.repository }}" --cleanup-tag -y 2>/dev/null || true
          test -f Transport-unsigned.ipa
          FILES="Transport-unsigned.ipa"
          [ -f Transport-xtool-unsigned.ipa ] && FILES="$FILES Transport-xtool-unsigned.ipa"
          gh release create "$TAG" $FILES --repo "${{ github.repository }}" --prerelease \
            --title "iPhone app build $BUILD" \
            --notes "Unsigned iPhone app, build $BUILD (CI run ${{ github.run_number }}). Tested on an iPhone 16 Pro simulator by the UI tap through. Sideload with Sideloadly or AltStore using your own Apple ID. See ios-native/INSTALL.md."
