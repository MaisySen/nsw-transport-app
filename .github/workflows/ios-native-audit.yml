# Native audit: snapshot-only visual check of every native surface (30 Oct 2026). Runs before every native build.
# Renders the shipped SwiftUI views on the iOS and watchOS simulators: Next trip and Stop board widgets in every
# family (Home Screen, Lock Screen, StandBy), both Live Activities (Lock Screen, Dynamic Island compact, minimal,
# expanded), the Apple Watch app and its complications; smallest, standard and largest devices; default and
# xxxLarge text; light and dark; long names, no live data, changes, delays, cancellations. Fails when anything is
# drawn outside its box. Contact sheets (one PNG per surface) are in the artifact.
# No secrets, no signing, no upload. From build 211 the module job also compiles the app (simulator, unsigned). Manual trigger on any branch that carries
# app/native-tests/native-audit, and called by the build workflow before it builds.
name: iOS native audit (snapshots only)

on:
  workflow_dispatch:
    inputs:
      entry:
        description: "Also run the app on the simulator and open every outside link (back paths, about 60 min)"
        type: boolean
        default: true
      only_entry:
        description: "Only the entry job (the snapshot, compile and Watch jobs already passed on this commit)"
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    if: github.event_name != 'workflow_dispatch' || !inputs.only_entry
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app/native-tests/native-audit
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
      - name: Project
        run: |
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xg
          "$(find /tmp/xg -type f -name xcodegen -perm -u+x | head -1)" generate
      - name: iPhone simulator
        working-directory: app/native-tests/native-audit
        run: |
          # A classic one-screen iPhone, made for this job: the runner's newest device types have two displays and a
          # wide layout (runs 41286058379, 41290208281), which is not the phone Bidur holds.
          RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x.get('platform')=='iOS' and x.get('isAvailable')]; print(r[-1]['identifier'])")
          DEV=""
          for DT in iPhone-16 iPhone-16-Pro iPhone-15 iPhone-15-Pro iPhone-17 iPhone-16e iPhone-14; do
            DEV=$(xcrun simctl create "Entry $DT" "com.apple.CoreSimulator.SimDeviceType.$DT" "$RT" 2>/dev/null) && { echo "simulator $DT on $RT"; break; }
          done
          if [ -z "$DEV" ]; then xcrun simctl list devices available -j > /tmp/devs.json; DEV=$(python3 sim.py phone /tmp/devs.json); fi
          test -n "$DEV"; echo "$DEV" > /tmp/sim-id.txt
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b > /dev/null
      - name: Open every outside link, app closed and open, and tap Back (UI test, app/native-tests/entry-ui)
        working-directory: app/native-tests/entry-ui
        timeout-minutes: 45
        run: |
          DEV=$(cat /tmp/sim-id.txt)
          xcrun simctl install "$DEV" "$(cat /tmp/app-path.txt)"
          for s in location location-always photos contacts calendar; do xcrun simctl privacy "$DEV" grant "$s" com.maisysen.nswtransport 2>/dev/null || true; done
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q -o /tmp/xcodegen.zip -d /tmp/xg
          "$(find /tmp/xg -type f -name xcodegen -perm -u+x | head -1)" generate
          mkdir -p "$GITHUB_WORKSPACE/out/entry"
          # simctl openurl asks "Open in Transport?" and simctl io cannot pick one of the runner's two displays (runs
          # 41286058379, 41287901448), so a UI test opens the links, answers the system prompts and taps Back.
          set +e
          xcodebuild test -project EntryUI.xcodeproj -scheme EntryUITests -destination "id=$DEV" \
            -resultBundlePath "$GITHUB_WORKSPACE/out/entry-ui.xcresult" \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 1200 \
            TEST_RUNNER_ENTRY_OUT="$GITHUB_WORKSPACE/out/entry" > "$GITHUB_WORKSPACE/out/entry-test.log" 2>&1
          RC=$?
          set -e
          grep -E "Test Case|error:|XCTAssert|Executed" "$GITHUB_WORKSPACE/out/entry-test.log" | tail -80
          # The pictures and results as named files (the test's own files stay inside the simulator).
          xcrun xcresulttool export attachments --path "$GITHUB_WORKSPACE/out/entry-ui.xcresult" --output-path "$GITHUB_WORKSPACE/out/entry" || true
          python3 - "$GITHUB_WORKSPACE/out/entry" <<'EOF' || true
          import json, os, sys
          d = sys.argv[1]
          m = json.load(open(os.path.join(d, 'manifest.json')))
          for t in m:
              for a in t.get('attachments', []):
                  src = os.path.join(d, a['exportedFileName'])
                  name = (a.get('suggestedHumanReadableName') or a['exportedFileName']).split('_0_')[0]
                  ext = os.path.splitext(a['exportedFileName'])[1]
                  if os.path.exists(src): os.replace(src, os.path.join(d, name + ext))
          for f in sorted(os.listdir(d)):
              if f.startswith('result-'): print(open(os.path.join(d, f)).read().strip())
          EOF
          ls "$GITHUB_WORKSPACE"/out/entry/*.png > /dev/null 2>&1 && rm -rf "$GITHUB_WORKSPACE/out/entry-ui.xcresult"
          exit $RC
      - name: Contact sheet
        if: always()
        working-directory: app/native-tests/native-audit
        run: |
          python3 -m venv /tmp/v && /tmp/v/bin/pip -q install pillow
          /tmp/v/bin/python entry_sheet.py "$GITHUB_WORKSPACE/out/entry" "$GITHUB_WORKSPACE/out/entry-sheet.png" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-audit-entry
          path: out
          retention-days: 14
