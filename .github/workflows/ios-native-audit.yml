# Native audit: snapshot-only visual check of every native surface (30 Oct 2026). Runs before every native build.
# Renders the shipped SwiftUI views on the iOS and watchOS simulators: Next trip and Stop board widgets in every
# family (Home Screen, Lock Screen, StandBy), both Live Activities (Lock Screen, Dynamic Island compact, minimal,
# expanded), the Apple Watch app and its complications; smallest, standard and largest devices; default and
# xxxLarge text; light and dark; long names, no live data, changes, delays, cancellations. Fails when anything is
# drawn outside its box. Contact sheets (one PNG per surface) are in the artifact.
# No secrets, no signing, no app build, no upload. Manual trigger on any branch that carries
# app/native-tests/native-audit, and called by the build workflow before it builds.
name: iOS native audit (snapshots only)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app/native-tests/native-audit
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
      - name: Project
        run: |
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xg
          "$(find /tmp/xg -type f -name xcodegen -perm -u+x | head -1)" generate
      - name: iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/devs.json
          DEV=$(python3 sim.py ios /tmp/devs.json)
          if [ -z "$DEV" ]; then
            RT=$(xcrun simctl list runtimes | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]*' | tail -1)
            for DT in $(xcrun simctl list devicetypes | grep -o 'com.apple.CoreSimulator.SimDeviceType.iPhone[^)]*' | tail -r); do
              DEV=$(xcrun simctl create "Audit iPhone" "$DT" "$RT" 2>/dev/null) && break
            done
          fi
          echo "simulator $DEV"; test -n "$DEV"; echo "$DEV" > /tmp/sim-id.txt
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b > /dev/null
      - name: Audit (iPhone widgets, Lock Screen, StandBy, Live Activities, Dynamic Island)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out/ios"
          TEST_RUNNER_SNAPSHOT_DIR="$GITHUB_WORKSPACE/out/ios" TEST_RUNNER_TZ=Australia/Sydney \
          xcodebuild test -project NativeAudit.xcodeproj -scheme NativeAuditTests -destination "id=$(cat /tmp/sim-id.txt)" \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO > "$GITHUB_WORKSPACE/out/ios-test.log" 2>&1 \
            || { grep -E "error:|DOES NOT FIT|failed" "$GITHUB_WORKSPACE/out/ios-test.log" | sort -u | head -150; touch "$GITHUB_WORKSPACE/out/FAILED-ios"; }
          grep -E "native audit:" "$GITHUB_WORKSPACE/out/ios-test.log" | head -3 || true
          ls "$GITHUB_WORKSPACE/out/ios" | wc -l
      - name: Contact sheets
        if: always()
        run: |
          python3 -m venv /tmp/v && /tmp/v/bin/pip -q install pillow
          /tmp/v/bin/python sheets.py "$GITHUB_WORKSPACE/out/ios" "$GITHUB_WORKSPACE/out/sheets" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-audit-ios
          path: out
          retention-days: 14
      - name: Result
        run: test ! -e "$GITHUB_WORKSPACE/out/FAILED-ios"

  watch:
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/native-tests/native-audit
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch 2>&1 | tail -2 || true
          # The simulator service must be the selected Xcode's: a service left running from the image's default Xcode
          # is the likely reason xcodebuild saw the watch simulator as "watchOS Simulator (null)" while simctl
          # listed it booted (4 of 8 runs on 30 Oct). It starts again on the next simctl call.
          xcrun simctl shutdown all 2>/dev/null || true
          killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
          sleep 3
          xcrun simctl list runtimes | grep -i watch || true
      - name: Project
        run: |
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xg
          "$(find /tmp/xg -type f -name xcodegen -perm -u+x | head -1)" generate
      - name: Compile the Watch code (no simulator needed)
        run: |
          # Always compiles the watch app's Swift and the complications, whatever simulator the runner has, so a
          # compile error can never pass as a runner problem.
          mkdir -p "$GITHUB_WORKSPACE/out/watch"
          xcodebuild build-for-testing -project NativeAudit.xcodeproj -scheme WatchAuditTests \
            -destination 'generic/platform=watchOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO \
            > "$GITHUB_WORKSPACE/out/watch-build.log" 2>&1 \
            || { grep -E "error:" "$GITHUB_WORKSPACE/out/watch-build.log" | sort -u | head -150; echo "WATCH CODE DOES NOT COMPILE"; exit 1; }
          echo "watch code compiled"
      - name: Watch simulator
        run: |
          # A watch simulator chosen from xcodebuild's own list of destinations (watchsim.sh: as is, then the
          # simulator service restarted with a fresh device, then the runtime downloaded).
          if DEV=$(bash watchsim.sh NativeAudit.xcodeproj WatchAuditTests); then
            echo "simulator $DEV"; echo "$DEV" > /tmp/sim-id.txt
            xcrun simctl boot "$DEV" 2>&1 || true
            xcrun simctl bootstatus "$DEV" -b > /dev/null || true
          else
            echo "The Watch code compiled, but this runner has no watch simulator xcodebuild can test on."
            touch "$GITHUB_WORKSPACE/out/FAILED-watch-simulator"
          fi
      - name: Audit (Apple Watch app and complications)
        if: hashFiles('out/FAILED-watch-simulator') == ''
        run: |
          LOG="$GITHUB_WORKSPACE/out/watch-test.log"
          run_tests() {
            TEST_RUNNER_SNAPSHOT_DIR="$GITHUB_WORKSPACE/out/watch" TEST_RUNNER_TZ=Australia/Sydney \
            xcodebuild test -project NativeAudit.xcodeproj -scheme WatchAuditTests -destination "id=$1" \
              -derivedDataPath dd CODE_SIGNING_ALLOWED=NO > "$2" 2>&1
          }
          if ! run_tests "$(cat /tmp/sim-id.txt)" "$LOG"; then
            if grep -q "Simulator (null)" "$LOG" && DEV=$(bash watchsim.sh NativeAudit.xcodeproj WatchAuditTests); then
              # xcodebuild lost the runtime between the pick and the test: once more on a device it lists again.
              echo "watch simulator lost its runtime; once more on $DEV (first log: watch-test-1.log)"
              mv "$LOG" "$GITHUB_WORKSPACE/out/watch-test-1.log"
              run_tests "$DEV" "$LOG" || { grep -E "error:|DOES NOT FIT|failed" "$LOG" | sort -u | head -150; touch "$GITHUB_WORKSPACE/out/FAILED-watch"; }
            else
              grep -E "error:|DOES NOT FIT|failed" "$LOG" | sort -u | head -150; touch "$GITHUB_WORKSPACE/out/FAILED-watch"
            fi
          fi
          grep -E "native audit:" "$LOG" | head -3 || true
          ls "$GITHUB_WORKSPACE/out/watch" | wc -l
      - name: Contact sheets
        if: always()
        run: |
          python3 -m venv /tmp/v && /tmp/v/bin/pip -q install pillow
          /tmp/v/bin/python sheets.py "$GITHUB_WORKSPACE/out/watch" "$GITHUB_WORKSPACE/out/sheets" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-audit-watch
          path: out
          retention-days: 14
      - name: Result
        run: |
          if [ -e "$GITHUB_WORKSPACE/out/FAILED-watch-simulator" ]; then
            echo "Watch code compiled; no watch simulator on this runner, so no Watch snapshots. Run the audit again."; exit 1
          fi
          test ! -e "$GITHUB_WORKSPACE/out/FAILED-watch"
