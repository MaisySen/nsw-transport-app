name: timetable
# Daily board engine timetable (docs/ENGINE.md): GTFS schedule bundles from Transport for NSW, built into one row per
# stop and service day, loaded into the engine at api.transportsydney.app. Yesterday, today and the next 2 days,
# loaded every second day (budget mode, docs/COSTS.md).
on:
  schedule:
    - cron: "40 15 * * *"   # 2:40 AM Sydney in summer time, 1:40 AM in winter
  workflow_dispatch:
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Budget mode (docs/COSTS.md): each engine load writes about 1.3 million rows into the engine's storage (50 million
      # a month included). The build holds 4 days (yesterday to 2 days ahead), so the engine is loaded only when it does
      # not already hold today and tomorrow: every second day. A failed load is tried again the next night.
      - name: Engine load needed?
        id: need
        run: |
          set -euo pipefail
          today=$(TZ=Australia/Sydney date +%Y%m%d); tomorrow=$(TZ=Australia/Sydney date -d tomorrow +%Y%m%d)
          days=$(curl -sf --max-time 30 https://api.transportsydney.app/api/engine/status | python3 -c 'import sys,json; print(" ".join(json.load(sys.stdin).get("days") or []))' || true)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && echo " $days " | grep -q " $today " && echo " $days " | grep -q " $tomorrow "; then
            echo "engine holds $days: no engine load tonight"; echo "engine=no" >> "$GITHUB_OUTPUT"
          else
            echo "engine holds ${days:-nothing}: loading"; echo "engine=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Download GTFS
        if: steps.need.outputs.engine == 'yes'
        env:
          KEY: ${{ secrets.TFNSW_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p gtfs
          get() { for i in 1 2 3; do curl -sfL -H "Authorization: apikey $KEY" -o "gtfs/$1.zip" "https://api.transport.nsw.gov.au$2" && return 0; sleep 5; done; return 1; }
          get buses /v1/gtfs/schedule/buses
          get sydneytrains /v1/gtfs/schedule/sydneytrains
          get metro /v2/gtfs/schedule/metro
          get ferry /v1/gtfs/schedule/ferries/sydneyferries
          get ferry_mff /v1/gtfs/schedule/ferries/MFF
          get lr_cse /v1/gtfs/schedule/lightrail/cbdandsoutheast
          get lr_iw /v1/gtfs/schedule/lightrail/innerwest
          get lr_par /v1/gtfs/schedule/lightrail/parramatta
          get lr_new /v1/gtfs/schedule/lightrail/newcastle
          get nswtrains /v1/gtfs/schedule/nswtrains
          for n in northcoast northcoast2 northcoast3 centralwestandorana centralwestandorana2 riverinamurray riverinamurray2 southeasttablelands southeasttablelands2 newenglandnorthwest newcastlehunter farwest sydneysurrounds; do get "rb_$n" "/v1/gtfs/schedule/regionbuses/$n"; sleep 1; done
      - name: Download complete GTFS
        env:
          KEY: ${{ secrets.TFNSW_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p gtfs
          [ -f complete.zip ] || curl -sfL --retry 3 -H "Authorization: apikey $KEY" -o complete.zip https://api.transport.nsw.gov.au/v1/publictransport/timetables/complete/gtfs
          unzip -p complete.zip stops.txt > gtfs/stops_complete.txt
      - name: Build
        if: steps.need.outputs.engine == 'yes'
        run: python3 backend/tools/build_timetable.py gtfs tt "$(TZ=Australia/Sydney date -d yesterday +%Y%m%d)" 4
      - name: Load
        if: steps.need.outputs.engine == 'yes'
        env:
          ENGINE_LOAD_KEY: ${{ secrets.ENGINE_LOAD_KEY }}
        run: node backend/tools/load_timetable.mjs tt
      # Our own trip planner (docs/SCALE_1M.md): today's pack from the same complete bundle, no extra NSW call. A failure
      # here leaves yesterday's pack in place (searches for today then go to the Trip Planner), so it does not fail the job.
      - name: Planner pack
        continue-on-error: true
        env:
          ENGINE_LOAD_KEY: ${{ secrets.ENGINE_LOAD_KEY }}
        run: |
          python3 backend/tools/build_planner.py complete.zip planner.bin
          node backend/tools/load_planner.mjs planner.bin
