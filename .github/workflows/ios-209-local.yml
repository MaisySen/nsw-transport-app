# Build 209 on a GitHub hosted Mac with `eas build --local` (30 Oct 2026). A local build uses none of the
# Expo plan's monthly iOS builds. Manual trigger only (never on pull requests, so a fork never sees the secrets),
# and only from the build-209 branch (build 212 and later: also build-212-rc, runtime 1.3.0, 1 Nov). Signing: the distribution certificate and the four App Store profiles
# (the app's profile regenerated on 30 Oct with Time Sensitive) arrive as one secret and are deleted at the end.
# Upload goes to App Store Connect for TestFlight only. Nothing here submits for App Review.
name: iOS build 209+ (local EAS build, TestFlight upload; widget snapshots)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the signed build to App Store Connect (TestFlight only)"
        type: choice
        options: ["yes", "no"]
        default: "yes"
      mode:
        description: "build: signed build (and upload). snapshots: widget fit check and snapshots only, no secrets used"
        type: choice
        options: ["build", "snapshots"]
        default: "build"

permissions:
  contents: read

concurrency:
  group: ios-209
  cancel-in-progress: false

jobs:
  # Every native build runs the native audit first (snapshots of every widget, Lock Screen, Live Activity,
  # Dynamic Island and Watch surface) and does not start when anything is cut off (30 Oct 2026).
  audit:
    if: inputs.mode != 'snapshots'
    uses: ./.github/workflows/ios-native-audit.yml

  build:
    needs: audit
    if: (github.ref == 'refs/heads/build-209' || github.ref == 'refs/heads/build-212-rc') && inputs.mode != 'snapshots'
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      NODE_OPTIONS: "--max-old-space-size=8192"
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Xcode 27.1 (iOS 27.1 SDK)
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphoneos|watchos'
          pod --version; fastlane --version | tail -1 || true

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Signing files (from the secret, never printed)
        env:
          CREDS: ${{ secrets.IOS209_CREDENTIALS_TGZ }}
        run: |
          printf '%s' "$CREDS" | base64 --decode | tar -xzf - -C .
          ls credentials/ios | sed 's/^/  /'
          for f in credentials/ios/*.mobileprovision; do
            security cms -D -i "$f" > /tmp/p.plist
            echo "$f: $(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/p.plist), time sensitive: $(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.usernotifications.time-sensitive' /tmp/p.plist 2>/dev/null || echo no)"
          done
          rm -f /tmp/p.plist

      - name: Runtime and build number (build 210 is runtime 1.2.0, 30 Oct)
        run: |
          # Main's nightly update is published to runtime 1.0.0 and 1.1.0. Build 210 carries JavaScript main does not
          # have, so it must be on its own runtime 1.2.0, or it would download main's bundle and lose that code.
          RT=$(node -e 'const a=require("./app.json").expo; process.stdout.write(typeof a.runtimeVersion==="string"?a.runtimeVersion:JSON.stringify(a.runtimeVersion))')
          BN=$(node -e 'process.stdout.write(require("./app.json").expo.ios.buildNumber)')
          echo "runtime $RT, build $BN"
          if [ "$BN" -ge 210 ] && { [ "$RT" = "1.0.0" ] || [ "$RT" = "1.1.0" ]; }; then echo "build $BN must not use runtime $RT (main publishes there)"; exit 1; fi
          # Build 212 (1 Nov) has native code builds 210 and 211 do not (card version 3, arrival sound): its own runtime
          # 1.3.0, so an update published for 1.2.0 can never land on it, and the other way round.
          if [ "$BN" -ge 212 ] && [ "$RT" = "1.2.0" ]; then echo "build $BN must not use runtime 1.2.0 (builds 210 and 211)"; exit 1; fi
          if [ "$BN" -ge 212 ] && [ "$GITHUB_REF" != "refs/heads/build-212-rc" ] && [ "$GITHUB_REF" != "refs/heads/build-209" ]; then echo "unexpected branch $GITHUB_REF"; exit 1; fi

      - name: EAS local build (production profile)
        run: |
          set -o pipefail
          npx -y eas-cli@latest whoami
          # Build 212: keep the local build's working folder (removed in the clean up step) so every dSYM in the archive,
          # the Watch app's included, can be sent to Sentry after the upload.
          export EAS_LOCAL_BUILD_SKIP_CLEANUP=1 EAS_LOCAL_BUILD_WORKINGDIR="$RUNNER_TEMP/easwd"
          npx -y eas-cli@latest build --platform ios --profile production --local --non-interactive \
            --output "$RUNNER_TEMP/Transport.ipa" 2>&1 | tee "$RUNNER_TEMP/build.log"
          ls -la "$RUNNER_TEMP/Transport.ipa"

      - name: Check the IPA
        run: |
          set -e
          cd "$RUNNER_TEMP" && rm -rf ipa && mkdir ipa && cd ipa && unzip -q ../Transport.ipa
          APP=$(ls -d Payload/*.app)
          for b in "$APP" "$APP"/PlugIns/*.appex "$APP"/Watch/*.app "$APP"/Watch/*.app/PlugIns/*.appex; do
            [ -e "$b" ] || continue
            echo "== $b"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$b/Info.plist"
            echo "version $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$b/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$b/Info.plist"))"
            codesign -d --entitlements :- "$b" 2>/dev/null > /tmp/e.plist || true
            for k in aps-environment get-task-allow com.apple.developer.usernotifications.time-sensitive com.apple.security.application-groups beta-reports-active; do
              echo "  $k: $(/usr/libexec/PlistBuddy -c "Print :$k" /tmp/e.plist 2>/dev/null | tr '\n' ' ' || echo absent)"
            done
          done
          echo "== Expo.plist"
          IPA_RT=$(/usr/libexec/PlistBuddy -c 'Print :EXUpdatesRuntimeVersion' "$APP/Expo.plist")
          WANT_RT=$(node -e 'process.stdout.write(String(require(process.env.GITHUB_WORKSPACE + "/app/app.json").expo.runtimeVersion))')
          echo "runtime $IPA_RT (app.json $WANT_RT)"
          [ "$IPA_RT" = "$WANT_RT" ] || { echo "IPA runtime $IPA_RT is not app.json's $WANT_RT"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :EXUpdatesRequestHeaders' "$APP/Expo.plist"
          echo "UIBackgroundModes: $(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist" 2>/dev/null || echo absent)"
          grep -c NSPrivacyCollectedDataTypeCrashData "$APP/PrivacyInfo.xcprivacy" && echo "privacy manifest: Crash Data listed"
          if grep -r -l -E 'tab\.bot|nsw-transport-bot' "$APP" >/dev/null 2>&1; then echo "OLD ADDRESS FOUND:"; grep -r -l -E 'tab\.bot|nsw-transport-bot' "$APP" | head; else echo "no old address in the IPA"; fi
          grep -i -E 'sentry' "$RUNNER_TEMP/build.log" | grep -i -E 'upload|error|warn' | sort -u | head -20 || true
          shasum -a 256 "$RUNNER_TEMP/Transport.ipa"

      - name: Upload to App Store Connect (TestFlight only, no review submit)
        if: inputs.upload == 'yes'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/Transport.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal 2>&1 | tee "$RUNNER_TEMP/upload.log"
          grep -q -i -E 'No errors uploading|UPLOAD SUCCEEDED|successfully uploaded' "$RUNNER_TEMP/upload.log"

      - name: Sentry debug symbols for every target, the Watch app included, and the JavaScript source map (build 212; never fails the build)
        if: success()
        continue-on-error: true
        run: |
          # Build 211's own "Upload Debug Symbols to Sentry" phase timed out before the dSYMs existed, so they are sent
          # here from the archive and the kept working folder.
          D=$( { find "$RUNNER_TEMP/easwd" -type d -name '*.dSYM' 2>/dev/null; find ~/Library/Developer/Xcode/Archives -type d -name '*.dSYM' -mmin -240 2>/dev/null; } | sort -u)
          echo "$D" | sed 's#.*/##' | sort | uniq -c
          if [ -n "$D" ]; then
            mkdir -p "$RUNNER_TEMP/dsyms" && echo "$D" | while read -r d; do cp -R "$d" "$RUNNER_TEMP/dsyms/" 2>/dev/null || true; done
            npx -y @sentry/cli@2 debug-files upload --org fintex-australia-bk --project transport-sydney-live "$RUNNER_TEMP/dsyms" 2>&1 | tail -25
          else echo "no dSYMs found"; fi
          # JavaScript: the bundle in the IPA carries a debug ID (metro.config.js); its source map is uploaded by that ID.
          cd "$RUNNER_TEMP" && rm -rf ipa2 jsmap && mkdir ipa2 jsmap && cd ipa2 && unzip -q ../Transport.ipa 'Payload/*.app/main.jsbundle' || true
          B=$(ls "$RUNNER_TEMP"/ipa2/Payload/*.app/main.jsbundle 2>/dev/null | head -1 || true)
          ID=$( { [ -n "$B" ] && tail -c 300 "$B" | grep -o 'debugId=[0-9a-fA-F-]*' | cut -d= -f2; } || true)
          echo "IPA bundle debug ID: ${ID:-none}"
          M=$(find "$RUNNER_TEMP/easwd" -name 'main.jsbundle.map' 2>/dev/null | head -1)
          if [ -n "$M" ] && [ -n "$ID" ] && grep -q "$ID" "$M"; then
            cp "$B" "$RUNNER_TEMP/jsmap/main.jsbundle"; cp "$M" "$RUNNER_TEMP/jsmap/main.jsbundle.map"; echo "source map from the build"
          else
            # Same checkout, same Metro: the bundle is rebuilt and used only when its debug ID equals the IPA's.
            cd "$GITHUB_WORKSPACE/app" && npx expo export:embed --platform ios --dev false --reset-cache \
              --entry-file index.js --bundle-output "$RUNNER_TEMP/jsmap/main.jsbundle" \
              --sourcemap-output "$RUNNER_TEMP/jsmap/main.jsbundle.map" --assets-dest "$RUNNER_TEMP/jsmap/assets" 2>&1 | tail -3
            rm -rf "$RUNNER_TEMP/jsmap/assets"
            ID2=$( { tail -c 300 "$RUNNER_TEMP/jsmap/main.jsbundle" 2>/dev/null | grep -o 'debugId=[0-9a-fA-F-]*' | cut -d= -f2; } || true)
            echo "rebuilt bundle debug ID: ${ID2:-none}"
            [ -n "$ID" ] && [ "$ID" = "$ID2" ] || { echo "debug IDs differ: JavaScript source map NOT uploaded"; exit 0; }
          fi
          BN=$(node -e 'process.stdout.write(require(process.env.GITHUB_WORKSPACE + "/app/app.json").expo.ios.buildNumber)')
          VER=$(node -e 'process.stdout.write(require(process.env.GITHUB_WORKSPACE + "/app/app.json").expo.version)')
          npx -y @sentry/cli@2 sourcemaps upload --org fintex-australia-bk --project transport-sydney-live \
            --release "com.maisysen.nswtransport@$VER+$BN" --dist "$BN" "$RUNNER_TEMP/jsmap" 2>&1 | tail -15
          rm -rf "$RUNNER_TEMP/dsyms" "$RUNNER_TEMP/jsmap" "$RUNNER_TEMP/ipa2"

      - name: Clean up signing files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/easwd" "$RUNNER_TEMP/dsyms" "$RUNNER_TEMP/jsmap" "$RUNNER_TEMP/ipa2"
          rm -rf credentials credentials.json ~/.appstoreconnect "$RUNNER_TEMP/ipa" "$RUNNER_TEMP/Transport.ipa"
          security delete-keychain "$RUNNER_TEMP"/*.keychain-db 2>/dev/null || true

  # Build 210 (30 Oct): the trip widget rendered in every family at the smallest to the largest iPhone widget
  # sizes and at a larger text size, with a check that each layout fits. Uses no secrets.
  snapshots:
    if: github.ref == 'refs/heads/build-209' && inputs.mode == 'snapshots'
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app/native-tests/widget-snapshots
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Project
        run: |
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xg
          XG=$(find /tmp/xg -type f -name xcodegen -perm -u+x | head -1)
          "$XG" generate

      - name: Simulator
        run: |
          xcrun simctl list devices available -j > /tmp/devs.json
          DEV=$(python3 - <<'PY'
          import json
          d = json.load(open('/tmp/devs.json'))['devices']
          ios = sorted([k for k in d if '.iOS-' in k], key=lambda k: [int(p) for p in k.split('.iOS-')[1].split('-')])
          for k in reversed(ios):
              ph = [x for x in d[k] if x['name'].startswith('iPhone')]
              if not ph:
                  continue
              pick = [x for x in ph if x['name'].endswith(' Pro')] or ph
              print(pick[-1]['udid'])
              import sys; sys.stderr.write('simulator: %s on %s\n' % (pick[-1]['name'], k))
              break
          PY
          )
          if [ -z "$DEV" ]; then
            RT=$(xcrun simctl list runtimes | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]*' | tail -1)
            for DT in $(xcrun simctl list devicetypes | grep -o 'com.apple.CoreSimulator.SimDeviceType.iPhone[^)]*' | tail -r); do
              DEV=$(xcrun simctl create "Widget shots" "$DT" "$RT" 2>/dev/null) && break
            done
          fi
          echo "simulator $DEV"
          test -n "$DEV"
          echo "$DEV" > /tmp/sim-id.txt
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b > /dev/null

      - name: Fit check and snapshots
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/out/widgets"
          TEST_RUNNER_SNAPSHOT_DIR="$GITHUB_WORKSPACE/out/widgets" TEST_RUNNER_TZ=Australia/Sydney \
          xcodebuild test -project WidgetSnapshots.xcodeproj -scheme WidgetSnapshotTests \
            -destination "id=$(cat /tmp/sim-id.txt)" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO > "$GITHUB_WORKSPACE/out/test.log" 2>&1 \
            || { grep -E "error:|failed|OVERFLOWS" "$GITHUB_WORKSPACE/out/test.log" | sort -u | head -80; touch "$GITHUB_WORKSPACE/out/FAILED"; }
          cat "$GITHUB_WORKSPACE/out/widgets/fit-report.txt" || true
          ls "$GITHUB_WORKSPACE/out/widgets" | wc -l

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-snapshots
          path: out
          retention-days: 7

      - name: Result
        run: test ! -e "$GITHUB_WORKSPACE/out/FAILED"
