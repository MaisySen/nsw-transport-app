<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live trip: Transport</title>
<meta name="description" content="Follow a shared trip live: the vehicle on the map, the next stop and the arrival time.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Follow my trip live">
<meta property="og:description" content="See where I am, the next stop and when I get in. Works until the trip ends.">
<meta property="og:image" content="https://nsw-transport-bot.sites.tab.bot/og.png">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/style.css">
</head>
<body class="full live-page">
<main id="view"><div class="mapwrap"><div id="map"></div></div>
<a class="map-btn left" href="/" aria-label="Transport home"><img src="/favicon-32.png" alt="" width="22" height="22" style="border-radius:6px"></a>
<button class="map-btn right" id="lFollow" aria-label="Show the trip"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.7 3.3a1 1 0 0 1 .2 1.1l-7 16a1 1 0 0 1-1.9-.2l-1.2-6-6-1.2a1 1 0 0 1-.2-1.9l16-7a1 1 0 0 1 1.1.2Z"/></svg></button>
<section class="sheet go-sheet" id="sheet"><div class="grab"></div><div class="sheet-body" id="sbody"><div class="go-pad"><div class="go-head"><div class="go-k">Live trip</div><div class="go-big">Loading</div></div></div></div></section>
</main>
<script src="/vendor/leaflet.js" defer></script>
<script src="/live/live.js" defer></script>
</body>
</html>
