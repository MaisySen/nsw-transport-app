# XcodeGen spec. The same sources as the xtool package, as a normal Xcode project.
# Used by CI for the simulator screenshots and as a second way to build the .ipa,
# and by anyone who wants to open the app in Xcode on a Mac: brew install xcodegen; xcodegen
name: Transport
options:
  bundleIdPrefix: com.maisysen
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "8"
    TARGETED_DEVICE_FAMILY: "1"
  configs:
    Release:
      # Whole module optimization took about 25 minutes for the Release build of build 8 (CI run 17);
      # one file at a time builds in about a minute. Used by the device ipa and the TestFlight archive.
      SWIFT_COMPILATION_MODE: singlefile
targets:
  TransportKit:
    type: library.static
    platform: iOS
    sources: [Sources/TransportKit]
  Transport:
    type: application
    platform: iOS
    sources:
      - Sources/Transport
      - Support/Assets.xcassets
      - path: Support/Privacy/App/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: Support/Transport.entitlements
      properties:
        com.apple.security.application-groups: [group.com.maisysen.nswtransport]
    info:
      path: Build/Transport-Info.plist
      properties:
        CFBundleDisplayName: Transport
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSLocationWhenInUseUsageDescription: Transport uses your location to show the stops and stations closest to you and to plan trips from where you are.
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.maisysen.nswtransport.refresh]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.maisysen.nswtransport
            CFBundleURLSchemes: [nswtransport]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maisysen.nswtransport
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TransportKit
      - target: TransportWidget
        embed: true
  TransportWidget:
    type: app-extension
    platform: iOS
    sources:
      - Sources/TransportWidget
      - path: Support/Privacy/Widget/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: Support/TransportWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.maisysen.nswtransport]
    info:
      path: Build/TransportWidget-Info.plist
      properties:
        CFBundleDisplayName: Transport
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maisysen.nswtransport.widget
    dependencies:
      - target: TransportKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  TransportUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.maisysen.nswtransport.uitests
        TEST_TARGET_NAME: Transport
    dependencies:
      - target: Transport
  TransportSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Sources/TransportWidget
      - Tests/Snapshots
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.maisysen.nswtransport.snapshots
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SNAPSHOT_TESTS"
    dependencies:
      - target: TransportKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
schemes:
  Transport:
    build:
      targets:
        Transport: all
    test:
      targets:
        - TransportUITests
        - TransportSnapshotTests
